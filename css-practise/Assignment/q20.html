<!DOCTYPE html>
<html lang="en">
<head>

    <!-- The title defines the title shown in the browser tab. -->
    <title>Important Head Elements</title>

    <!-- The charset defines the character encoding of the webpage. -->
    <meta charset="UTF-8">

    <!-- The description provides a short description of the webpage. -->
    <meta
        name="description"
        content="A webpage demonstrating important HTML head elements.">

    <!-- The author identifies the creator of the webpage. -->
    <meta name="author" content="Ankush">

    <!-- The base tag sets the base URL for relative links. -->
    <base href="https://example.com/">

    <!-- The link tag connects external resources such as a favicon. -->
    <link rel="icon" href="favicon.ico">

    <!-- The style tag is used for CSS. It is intentionally empty here. -->
    <style>
    </style>

    <!-- The script tag is used for JavaScript. It is intentionally empty here. -->
    <script>
    </script>

</head>
<body>

    <h1>Important HTML Head Elements</h1>

    <p>
        This webpage demonstrates different elements that can be
        included inside the HTML head section.
    </p>

</body>
</html>
