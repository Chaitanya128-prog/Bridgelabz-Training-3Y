<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 1: Borders and Padding</title>
    <link rel="stylesheet" href="q1_style.css">
</head>
<body>

    <header>
        <h1>Borders & Padding Demonstration</h1>
    </header>

    <main>
        <section class="container">
            <!-- Box 1: Solid border & small padding -->
            <div class="box solid">
                <h3>Solid Border</h3>
                <p>Padding: 15px</p>
            </div>

            <!-- Box 2: Dashed border & large padding -->
            <div class="box dashed">
                <h3>Dashed Border</h3>
                <p>Padding: 30px</p>
            </div>

            <!-- Box 3: Double border & rounded corners -->
            <div class="box double">
                <h3>Double Border</h3>
                <p>Border Radius: 15px</p>
            </div>

            <!-- Box 4: Groove border & asymmetrical padding/radius -->
            <div class="box groove">
                <h3>Groove Border</h3>
                <p>Border Radius: 30px 0px</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CSS Styling Lab</p>
    </footer>

</body>
</html>
