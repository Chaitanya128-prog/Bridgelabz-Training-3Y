<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards</title>
    <link rel="stylesheet" href="Filter_Cards_with_Animation.css">
</head>
<body>
    <main class="profile-container">
        <article class="profile-card">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300&q=80" alt="User 1">
            <div class="info"><h3>John Doe</h3><p>Designer</p></div>
        </article>
        <article class="profile-card">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=300&q=80" alt="User 2">
            <div class="info"><h3>Jane Smith</h3><p>Developer</p></div>
        </article>
        <article class="profile-card">
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=300&q=80" alt="User 3">
            <div class="info"><h3>Sam Wilson</h3><p>Creator</p></div>
        </article>
    </main>
</body>
</html>
