<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="Filter_Comparison_Layout.css">
</head>
<body>
    <header><h1>Before & After Comparison</h1></header>
    <main class="comparison-container">
        <figure class="comp-box">
            <img src="https://images.unsplash.com/photo-1542204165-65bf26472b9b?w=600&q=80" alt="Original Image">
            <figcaption>Original</figcaption>
        </figure>
        <figure class="comp-box">
            <img src="https://images.unsplash.com/photo-1542204165-65bf26472b9b?w=600&q=80" alt="Filtered Image" class="filtered-img">
            <figcaption>Filtered (Hover to clear)</figcaption>
        </figure>
    </main>
</body>
</html>
