<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 4: Shadows & Depth</title>
    <link rel="stylesheet" href="q4_style.css">
</head>
<body>

    <header>
        <h1 class="glowing-text">Depth & Shadow Cards</h1>
    </header>

    <main class="card-row">
        <!-- Card 1: Soft subtle shadow -->
        <article class="card subtle-shadow">
            <h3>Subtle Depth</h3>
            <p>Features a light blur radius and low-opacity box shadow for minimal depth.</p>
        </article>

        <!-- Card 2: Medium elevation shadow -->
        <article class="card medium-shadow">
            <h3>Medium Elevation</h3>
            <p>Utilizes an offset shadow with balanced blur for moderate emphasis.</p>
        </article>

        <!-- Card 3: Deep shadow effect -->
        <article class="card deep-shadow">
            <h3>High Contrast Depth</h3>
            <p>Utilizes multi-layered intense shadows to create high visual separation.</p>
        </article>
    </main>

</body>
</html>
