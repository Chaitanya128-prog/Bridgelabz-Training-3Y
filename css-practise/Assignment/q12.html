<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Entities</title>
</head>
<body>

    <h1>HTML Entities</h1>

    <p>
        Less than: &lt;
        Greater than: &gt;
        Ampersand: &amp;
        Double quotation: &quot;
        Single quotation: &apos;
    </p>

    <p>
        Copyright: &copy;
        Trademark: &trade;
        Registered: &reg;
    </p>

</body>
</html>
