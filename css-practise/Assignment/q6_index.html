<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 6: CSS Transformations Showcase</title>
    <link rel="stylesheet" href="q6_style.css">
</head>
<body>

    <header>
        <h1>CSS Transformations Showcase</h1>
        <p>Hover over each card to view the transition effect.</p>
    </header>

    <main class="transform-container">
        <!-- Rotate Box -->
        <div class="card-wrapper">
            <div class="box rotate-box">Rotate</div>
            <span class="label">rotate(45deg)</span>
        </div>

        <!-- Scale Box -->
        <div class="card-wrapper">
            <div class="box scale-box">Scale</div>
            <span class="label">scale(1.2)</span>
        </div>

        <!-- Translate Box -->
        <div class="card-wrapper">
            <div class="box translate-box">Translate</div>
            <span class="label">translateY(-20px)</span>
        </div>

        <!-- Skew Box -->
        <div class="card-wrapper">
            <div class="box skew-box">Skew</div>
            <span class="label">skewX(-15deg)</span>
        </div>
    </main>

</body>
</html>
