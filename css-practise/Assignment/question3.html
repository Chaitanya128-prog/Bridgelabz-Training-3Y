<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 3 - Responsive Image Showcase</title>
  <link rel="stylesheet" href="question3.css">
</head>
<body>
  <header><h1>Image Showcase Gallery</h1></header>
  <main>
    <div class="gallery-grid">
      <figure class="gallery-card"><div class="img-wrapper"><img src="https://picsum.photos/id/10/400/300" alt="Mountain"><div class="overlay"></div></div><figcaption>Peaceful Mountain Lake</figcaption></figure>
      <figure class="gallery-card"><div class="img-wrapper"><img src="https://picsum.photos/id/11/400/300" alt="Forest"><div class="overlay"></div></div><figcaption>Deep Misty Forest</figcaption></figure>
      <figure class="gallery-card"><div class="img-wrapper"><img src="https://picsum.photos/id/12/400/300" alt="Beach"><div class="overlay"></div></div><figcaption>Golden Sunlit Shore</figcaption></figure>
      <figure class="gallery-card"><div class="img-wrapper"><img src="https://picsum.photos/id/13/400/300" alt="River"><div class="overlay"></div></div><figcaption>Flowing River Stream</figcaption></figure>
      <figure class="gallery-card"><div class="img-wrapper"><img src="https://picsum.photos/id/14/400/300" alt="Coast"><div class="overlay"></div></div><figcaption>Coastal Cliffs</figcaption></figure>
      <figure class="gallery-card"><div class="img-wrapper"><img src="https://picsum.photos/id/15/400/300" alt="Waterfall"><div class="overlay"></div></div><figcaption>Tropical Waterfall</figcaption></figure>
    </div>
  </main>
  <footer><p>&copy; 2026 Responsive Grid Showcase</p></footer>
</body>
</html>
