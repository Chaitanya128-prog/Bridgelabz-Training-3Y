<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="Responsive_Image_Filter_Gallery.css">
</head>
<body>
    <header>
        <h1>Filter Gallery</h1>
    </header>
    <main>
        <section class="gallery-grid">
            <figure>
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=400&q=80" alt="Nature" class="filter-blur">
                <figcaption>Blur Filter</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=400&q=80" alt="Nature" class="filter-grayscale">
                <figcaption>Grayscale Filter</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=400&q=80" alt="Nature" class="filter-sepia">
                <figcaption>Sepia Filter</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=400&q=80" alt="Nature" class="filter-brightness">
                <figcaption>Brightness Filter</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=400&q=80" alt="Nature" class="filter-contrast">
                <figcaption>Contrast Filter</figcaption>
            </figure>
            <figure>
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=400&q=80" alt="Nature" class="filter-hue">
                <figcaption>Hue-Rotate Filter</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
