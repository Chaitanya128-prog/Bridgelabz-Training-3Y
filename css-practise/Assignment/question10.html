<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 10 - Mini UI Layout</title>
  <link rel="stylesheet" href="question10.css">
</head>
<body>
  <header class="main-header"><h1>Dashboard Registration</h1></header>
  <main class="container">
    <div class="card">
      <div class="card-image-wrapper"><img src="https://picsum.photos/id/1062/400/150" alt="Avatar Banner"></div>
      <form class="user-form">
        <h2>Join Us</h2>
        <div class="form-control">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username" required>
        </div>
        <div class="form-control">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter email" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Submit</button>
          <button type="reset" class="btn btn-secondary">Reset</button>
        </div>
      </form>
    </div>
  </main>
  <footer class="main-footer"><p>&copy; 2026 Responsive Mini UI Layout</p></footer>
</body>
</html>
