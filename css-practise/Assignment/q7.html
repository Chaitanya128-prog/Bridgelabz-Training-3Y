<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
</head>
<body>

    <h1>Login Form</h1>

    <!-- A CSRF token helps protect a form from Cross-Site Request Forgery attacks. -->

    <form action="#" method="post">

        <label for="username">Username:</label>
        <input type="text" id="username" name="username">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <!-- Dummy CSRF token -->
        <input type="hidden" name="csrf_token" value="dummy12345">

        <input type="submit" value="Login">

    </form>

</body>
</html>
