<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 2 - Pure CSS Tooltips</title>
  <link rel="stylesheet" href="question2.css">
</head>
<body>
  <header><h1>Pure CSS Tooltips</h1></header>
  <main class="tooltip-container">
    <div class="tooltip-wrapper">
      <span class="tooltip-target">Hover Me (Word)</span>
      <span class="tooltip-text">I am a text tooltip!</span>
    </div>
    <div class="tooltip-wrapper">
      <button class="tooltip-target btn">Hover Button</button>
      <span class="tooltip-text">Action tooltip message</span>
    </div>
    <div class="tooltip-wrapper">
      <span class="tooltip-target icon">&#9733;</span>
      <span class="tooltip-text">Star Rating Tooltip</span>
    </div>
  </main>
  <footer><p>&copy; 2026 CSS Tooltips Demo</p></footer>
</body>
</html>
