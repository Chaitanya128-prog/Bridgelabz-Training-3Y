<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Photo Gallery</h1>

<main class="gallery">

    <figure>
        <img src="https://picsum.photos/500/400?random=1" alt="Nature">
        <figcaption>Beautiful Nature</figcaption>
    </figure>

    <figure>
        <img src="https://picsum.photos/500/400?random=2" alt="Mountain">
        <figcaption>Mountain View</figcaption>
    </figure>

    <figure>
        <img src="https://picsum.photos/500/400?random=3" alt="City">
        <figcaption>City Life</figcaption>
    </figure>

    <figure>
        <img src="https://picsum.photos/500/400?random=4" alt="Forest">
        <figcaption>Green Forest</figcaption>
    </figure>

    <figure>
        <img src="https://picsum.photos/500/400?random=5" alt="Beach">
        <figcaption>Beautiful Beach</figcaption>
    </figure>

    <figure>
        <img src="https://picsum.photos/500/400?random=6" alt="Road">
        <figcaption>Open Road</figcaption>
    </figure>

</main>

</body>
</html>
