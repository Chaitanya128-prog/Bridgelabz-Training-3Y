<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URI Encoding</title>
</head>
<body>

    <h1>URI Encoding Demonstration</h1>

    <p>Encoded URL:</p>

    <a href="https://example.com/search?query=HTML%20%26%20CSS">
        Search for HTML &amp; CSS
    </a>

    <p>
        In the URL, spaces are represented using %20 and the ampersand
        is represented using %26.
    </p>

</body>
</html>
