<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 9 - Combined Effects</title>
  <link rel="stylesheet" href="question9.css">
</head>
<body>
  <header><h1>Combined CSS Effects</h1></header>
  <main class="grid-container">
    <div class="card effect-card-1">
      <h2>Scale & Shadow</h2>
      <p>Grows and casts a larger shadow on hover.</p>
      <button class="interactive-btn">Hover Action</button>
    </div>
    <div class="card effect-card-2">
      <h2>Rotate & Color</h2>
      <p>Slightly tilts and changes tone seamlessly.</p>
      <button class="interactive-btn">Hover Action</button>
    </div>
    <div class="card effect-card-3">
      <h2>Lift & Glow</h2>
      <p>Lifts upward with a colorful focus effect.</p>
      <button class="interactive-btn">Hover Action</button>
    </div>
  </main>
  <footer><p>&copy; 2026 Combined Effects</p></footer>
</body>
</html>
