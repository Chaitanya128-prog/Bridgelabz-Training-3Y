<!DOCTYPE html>
<html>
<head>
    <title>Travel Selection</title>
</head>
<body>

    <h1>Select Your Travel Preferences</h1>

    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>USA</option>
        <option>France</option>
        <option>Japan</option>
    </select>

    <br><br>

    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Delhi</option>
        <option>Rajasthan</option>
        <option>Goa</option>
    </select>

    <br><br>

    <label for="city">City:</label>
    <select id="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Jaipur</option>
        <option>Delhi</option>
    </select>

    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Gateway of India</option>
        <option>Red Fort</option>
        <option>India Gate</option>
    </select>

    <br><br>

    <p>
        <strong>My Choices:</strong>
        I have selected India as my country,
        Uttar Pradesh as my state,
        Mathura as my city,
        and Taj Mahal as my favorite tourist place.
    </p>

</body>
</html>
