<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Application Form</title>
</head>
<body>
    <form action="#" method="post">
        <h2>Internship Application Form</h2>

        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <br><br>

        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>

        <label for="course">Course:</label>
        <select id="course" name="course" required>
            <option value="" selected disabled>Select your course</option>
            <option value="cse">CSE</option>
            <option value="it">IT</option>
            <option value="ece">ECE</option>
            <option value="mechanical">Mechanical</option>
        </select>
        <br><br>

        <label>Skills:</label><br>
        <input type="checkbox" id="java" name="skills" value="Java">
        <label for="java">Java</label>

        <input type="checkbox" id="javascript" name="skills" value="JavaScript">
        <label for="javascript">JavaScript</label>

        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label>

        <input type="checkbox" id="react" name="skills" value="React">
        <label for="react">React</label>
        <br><br>

        <label>Internship Preference:</label><br>
        <input type="radio" id="fullTime" name="internshipPreference" value="Full Time" required>
        <label for="fullTime">Full Time</label>

        <input type="radio" id="partTime" name="internshipPreference" value="Part Time">
        <label for="partTime">Part Time</label>

        <input type="radio" id="remote" name="internshipPreference" value="Remote">
        <label for="remote">Remote</label>
        <br><br>

        <label for="resume">Resume Upload:</label>
        <input type="file" id="resume" name="resume" required>
        <br><br>

        <label for="coverLetter">Cover Letter:</label><br>
        <textarea id="coverLetter" name="coverLetter" rows="5" cols="40" placeholder="Write your cover letter here..." required></textarea>
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
