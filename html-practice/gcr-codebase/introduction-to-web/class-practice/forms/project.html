<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project form</title>

</head>
<body>
    <h2>Personal Details</h2>
    <form>
        <fieldset>
            
            <legend>Personal Information</legend>
            <label for="Login Id">Login Id:</label>
            <input type="text" id="Login Id" name="Login Id" placeholder="Enter your login id">
            <br/>
            <br/>
            <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password">
        <br/>
        <br/>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date">
        <br/>
        <br/>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">
        <br/>
        <br/>
         <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="Other" name="gender" value="other">
        <label for="Other">Other</label>
        <br/>
        <br/>
        <label for="checkbox1">Spanish</label>
        <input type="checkbox" id="checkbox1" name="checkbox1" value="checkbox1">
        <label for="checkbox2">Hindi</label>
        <input type="checkbox" id="checkbox2" name="checkbox2" value="checkbox2">
        <label for="checkbox3">English</label>
        <input type="checkbox" id="checkbox3" name="checkbox3" value="checkbox3">
        <br/>
        <br/>
        <label for="file1">Upload a file:</label>
        <input type="file" id="file1" name="file1">
        <br/>
        <br/>
        <label for="textarea1">Comments:</label>
        <br/>
        <textarea id="textarea1" name="textarea1" rows="4" cols="50"></textarea>
         <br/>
        <br/>
        <input type="image" name="images" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSggekUgFYa0fe_osOoUL0PogVk7o4TRKdUbuzxgfuPtA&s=10"
        height="100" width="100">
        <br/>
        <br/>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
     
        </fieldset>
    </form>





    
</body>
</html>
